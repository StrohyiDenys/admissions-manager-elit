<div class="login-container">
  
  <div class="card bg-dark text-white shadow p-4 login-box">
    <h3 class="text-center mb-4">Авторизація</h3>
    
    <div class="mb-3">
      <label class="form-label">Логін</label>
      <input type="text" class="form-control" [(ngModel)]="username" placeholder="Введіть логін">
    </div>
    
    <div class="mb-3">
      <label class="form-label">Пароль</label>
      <input type="password" class="form-control" [(ngModel)]="password" placeholder="Введіть пароль" (keyup.enter)="onLogin()">
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2 text-center">
      {{ errorMessage }}
    </div>

    <button class="btn btn-primary w-100 mt-2" (click)="onLogin()">Вхід</button>
  </div>

</div>
